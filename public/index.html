<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>독서합시다</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <div class="header-left"><h1>ZZIKSTYPE</h1></div>
</header>


<div class="main">
  <div class="submit-card">
    <h2>+ 명대사 추천</h2>
    <div class="form-row">
      <textarea id="menu-title" rows="3" placeholder="명대사 (지문 가능)" maxlength="500"></textarea>
    </div>
    <div class="form-row">
      <input id="menu-restaurant" type="text" placeholder="제목" maxlength="120" />
    </div>
    <div class="form-row">
      <input id="menu-author" type="text" placeholder="작가" maxlength="80" />
    </div>
    <div class="form-row">
      <input id="menu-submitter" type="text" placeholder="링크 (터진건 걍 비워두세염)" maxlength="80" />
    </div>
    <div class="form-row">
      <textarea id="menu-desc" rows="2" placeholder="이유"></textarea>
    </div>
    <button class="btn" id="submit-menu-btn">제출</button>
  </div>

  <div class="sort-bar">
    <button id="sort-top" class="active">개추순</button>
    <button id="sort-new">최신순</button>
    <button id="sort-tournament">소트</button>
  </div>

  <div id="feed-view" class="feed-view">
    <div id="menu-list" class="menu-list">
      <div class="empty-state"><div class="icon">🥺</div><p>추천이 없습니다... 하나 하고 가세요</p></div>
    </div>
  </div>

  <div id="tournament-view" class="tournament-view">
    <div id="tournament-leaderboard">
      <div class="tournament-header">
        <h2>🏆 명장면 소트 랭킹</h2>
        <div style="display:flex;gap:8px;">
          <button class="tournament-btn" id="tournament-history-btn" style="background:transparent;color:var(--text);border:1px solid var(--border);">내 기록</button>
          <button class="tournament-btn" id="tournament-play-btn">참여하기</button>
        </div>
      </div>
      <div id="ranking-list"></div>
    </div>

    <div id="tournament-game" style="display:none;">
      <div class="tournament-header">
        <h2 id="game-title">라운드 선택</h2>
        <div style="display:flex;gap:8px;">
          <button class="tournament-btn" id="game-ranking-btn" style="background:transparent;color:var(--text);border:1px solid var(--border);">랭킹 보기</button>
          <button class="tournament-btn" id="tournament-back-btn" style="display:none;">돌아가기</button>
        </div>
      </div>
      <div id="round-select" class="round-select"></div>
      <div id="match-area"></div>
    </div>

    <div id="tournament-result" style="display:none;"></div>

    <div id="tournament-history" style="display:none;">
      <div class="tournament-header">
        <h2>📋 내 소트 기록</h2>
        <div style="display:flex;gap:8px;">
          <button class="tournament-btn" id="history-ranking-btn" style="background:transparent;color:var(--text);border:1px solid var(--border);">랭킹 보기</button>
          <button class="tournament-btn" id="history-back-btn">참여하기</button>
        </div>
      </div>
      <div id="history-list"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/app.js"></script>

<!-- Edit Modal -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal-box">
    <div class="modal-header"><h3>게시글 수정</h3><button onclick="closeEditModal()">✕</button></div>
    <div class="modal-body">
      <div><label>명대사</label><textarea id="edit-title" rows="3"></textarea></div>
      <div><label>제목</label><input id="edit-restaurant" type="text"></div>
      <div><label>저자</label><input id="edit-author" type="text"></div>
      <div><label>이유</label><textarea id="edit-desc" rows="2"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeEditModal()">취소</button>
      <button class="btn-confirm" onclick="submitEdit()">수정하기</button>
    </div>
  </div>
</div>

<!-- Delete Modal -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal-box" style="max-width:360px;">
    <div class="modal-header"><h3>게시글 삭제</h3><button onclick="closeDeleteModal()">✕</button></div>
    <div class="modal-body" style="text-align:center;padding:24px 20px;">
      <p style="margin:0;font-size:15px;color:var(--text);">정말 삭제하시겠습니까?<br><span style="font-size:13px;color:var(--muted);">삭제된 게시글은 복구할 수 없습니다.</span></p>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeDeleteModal()">취소</button>
      <button class="btn-danger" onclick="submitDelete()">삭제하기</button>
    </div>
  </div>
</div>

<!-- Leave Game Modal -->
<div class="modal-overlay" id="leave-game-modal">
  <div class="modal-box" style="max-width:280px;">
    <div class="modal-header"><h3>랭킹 보기</h3><button onclick="closeLeaveGameModal()">✕</button></div>
    <div class="modal-body" style="text-align:center;padding:24px 20px;">
      <p style="margin:0;font-size:15px;color:var(--text);">진행 중인 소트가 사라집니다.<br><span style="font-size:13px;color:var(--muted);">랭킹 페이지로 이동하시겠습니까?</span></p>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeLeaveGameModal()">취소</button>
      <button class="btn-confirm" onclick="confirmLeaveGame()">이동하기</button>
    </div>
  </div>
</div>

<footer style="text-align:center;padding:24px 16px;font-size:12px;color:#76767F;border-top:1px solid rgba(118,118,127,0.15);margin-top:40px;">© 2026 cxwdxggy All rights reserved.</footer>
</body>
</html>
