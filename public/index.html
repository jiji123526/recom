<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ㅊㅊㅂㅌ</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #3478FF;
      --primary-dark: #1A66FF;
      --bg: #ffffff;
      --surface: #ffffff;
      --border: rgba(118,118,127,0.15);
      --text: #141415;
      --muted: #76767F;
      --up: #01B76C;
      --down: #F33D4D;
      --radius: 12px;
    }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 16px;
      line-height: 1.5;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    header {
      background: var(--surface);
      color: var(--text);
      padding: 0 16px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 { font-size: 21px; font-weight: 700; line-height: 1.33; letter-spacing: -0.025em; text-decoration: none; }
    header span { font-size: 1.5rem; }

    .header-left { display: flex; align-items: center; gap: 8px; flex-shrink: 0; font-weight: 700; }
    .header-search { flex: 1; max-width: 480px; margin: 0 auto; display: flex; align-items: center; gap: 8px; background: #F2F2F3; border-radius: 8px; padding: 0 12px; height: 40px; cursor: text; }
    .header-search svg { flex-shrink: 0; color: #76767F; }
    .header-search input { border: none; background: none; outline: none; font: inherit; font-size: 15px; flex: 1; min-width: 0; color: var(--text); }
    .header-search input::placeholder { color: #76767F; opacity: 1; }
    @media (max-width: 743px) { .header-search { max-width: none; } }


    .main { max-width: 640px; margin: 0 auto; padding: 0 16px; }

    .submit-card {
      background: var(--surface);
      padding: 1.25rem 0;
      margin-bottom: 0;
    }

    .submit-card h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text);
      line-height: 1.33;
    }

    .form-row {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }

    .form-row input, .form-row textarea {
      flex: 1;
      min-width: 200px;
      border: none;
      background: #F2F2F3;
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      font-size: 16px;
      font-family: inherit;
      resize: vertical;
      line-height: 1.33334;
    }

    .form-row input:focus, .form-row textarea:focus {
      outline: none;
      box-shadow: inset 0 0 0 1px var(--primary);
    }

    .btn {
      background: var(--text);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.2rem;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      line-height: 1.33;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:hover { background: #000; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .sort-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      height: 44px;
      border-bottom: 1px solid var(--border);
      padding: 0;
      margin-bottom: 0;
      position: sticky;
      top: 56px;
      z-index: 99;
      background: var(--surface);
    }

    .sort-bar button {
      background: none;
      border: none;
      padding: 0 4px;
      cursor: pointer;
      font-size: 16px;
      font-family: inherit;
      color: var(--muted);
      font-weight: 400;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .sort-bar button.active {
      color: var(--text);
      font-weight: 600;
    }

    .sort-bar button.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background-color: var(--text);
    }

    .menu-list { display: flex; flex-direction: column; }

    .menu-card {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    .menu-card-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 24px 0 20px;
    }

    .post-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0; }
    .post-header-left { display: flex; align-items: center; gap: 8px; }
    .post-avatar { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
    .post-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .post-header-info { display: flex; flex-direction: column; }

    .post-author-badge {
      margin: 0;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 1;
      overflow: hidden;
      overflow-wrap: anywhere;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.5;
    }
    @supports not (overflow-wrap: anywhere) {
      .post-author-badge { word-break: break-word; }
    }
    .post-nickname { font-size: 15px; font-weight: 600; line-height: 1.33; color: var(--text); }
    .post-meta-line { font-size: 13px; color: var(--muted); line-height: 1.33; }
    .post-more-btn {
      min-height: 32px;
      padding: 4px 4px 4px 8px;
      margin-right: -2px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #62626A;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: background-color 0.15s, color 0.15s;
    }
    .post-more-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
    .post-more-btn:active { background: rgba(118,118,127,0.08); }
    @media (hover: hover) and (pointer: fine) {
      .post-more-btn:hover { background: rgba(118,118,127,0.08); }
    }

    .post-more-wrapper { position: relative; }
    .post-dropdown { display: none; position: absolute; right: 0; top: 100%; background: #fff; border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); z-index: 50; min-width: 100px; overflow: hidden; }
    .post-dropdown.show { display: block; }
    .post-dropdown button { display: block; width: 100%; padding: 7px 16px; border: none; background: none; font: inherit; font-size: 14px; text-align: left; cursor: pointer; color: var(--text); }
    .post-dropdown button:hover { background: #F2F2F3; }
    .post-dropdown button:last-child { color: #F33D4D; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.25); z-index: 1000; align-items: center; justify-content: center; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: 12px; width: 90%; max-width: 480px; max-height: 85vh; overflow-y: auto; box-shadow: 0 12px 24px rgba(0,0,0,0.12); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .modal-header h3 { font-size: 18px; font-weight: 600; margin: 0; }
    .modal-header button { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 20px; padding: 4px; }
    .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .modal-body label { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 4px; display: block; }
    .modal-body input, .modal-body textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font: inherit; font-size: 14px; resize: vertical; }
    .modal-body input:focus, .modal-body textarea:focus { outline: none; border-color: var(--primary); }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border); }
    .modal-footer .btn-cancel { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 8px 16px; font-size: 14px; cursor: pointer; color: var(--text); }
    .modal-footer .btn-danger { background: #F33D4D; color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .modal-footer .btn-confirm { background: #141415; color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }

    .post-content { display: flex; flex-direction: column; gap: 5px; padding: 0; }
    .post-title {
      margin: 0;
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      line-height: 1.33334;
      letter-spacing: -0.025em;
      overflow-wrap: anywhere;
    }
    .post-body {
      font-size: 15px;
      line-height: 1.65;
      color: #62626A;
      margin: 0;
      font-weight: 400;
      letter-spacing: -0.025em;
      overflow-wrap: anywhere;
    }

    .post-actions { display: flex; justify-content: space-between; align-items: center; padding-top: 0; margin-top: -5px; }
    .post-comment-bubble { display: flex; align-items: flex-start; gap: 8px; background: #F9F9FA; border-radius: 8px; padding: 12px; cursor: pointer; }
    .post-comment-avatar { width: 24px; height: 24px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
    .post-comment-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .post-comment-text { font-size: 13px; line-height: 1.5; color: #141415; margin: 0; overflow: visible; display: flex; align-items: center; min-height: 24px; white-space: pre-wrap; }
    .post-actions-left { display: flex; align-items: center; gap: 4px; }
    .post-actions-right { display: flex; align-items: center; gap: 0; }
    .post-actions-right .post-icon-btn:last-child {
      padding-right: 3px;
    }
    .post-icon-btn {
      min-height: 32px;
      padding: 4px 8px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #62626A;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.33334;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.15s, color 0.15s;
    }
    .post-icon-btn:active { background: rgba(118,118,127,0.08); color: #141415; }
    @media (hover: hover) and (pointer: fine) {
      .post-icon-btn:hover { background: rgba(118,118,127,0.08); color: #141415; }
    }
    .post-icon-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

    .vote-btn {
      min-height: 32px;
      padding: 0 8px 0 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #62626A;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.33334;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      white-space: nowrap;
      transition: background-color 0.15s, color 0.15s;
    }
    .vote-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

    .vote-btn:active { background: rgba(118,118,127,0.08); color: #141415; }
    @media (hover: hover) and (pointer: fine) {
      .vote-btn.up:hover { background: rgba(118,118,127,0.08); color: #141415; }
    }
    .vote-btn.up.active svg { color: #F33D4D; }

    .toggle-comments {
      min-height: 32px;
      padding: 0 8px 0 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #62626A;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.33334;
      width: auto;
      text-align: left;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      white-space: nowrap;
      transition: background-color 0.15s, color 0.15s;
    }
    .toggle-comments svg { width: 20px; height: 20px; flex-shrink: 0; }

    .toggle-comments:active { background: rgba(118,118,127,0.08); color: #141415; }
    @media (hover: hover) and (pointer: fine) {
      .toggle-comments:hover { background: rgba(118,118,127,0.08); color: #141415; }
    }

    .comments-section {
      border-top: 1px solid var(--border);
      padding: 16px 0 0;
      margin-top: 4px;
      display: none;
    }

    .comments-section.open { display: block; }

    .comment-item {
      background: none;
      border: none;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      padding: 12px 0;
      margin-bottom: 0;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .comment-item:last-child { border-bottom: none; }

    .comment-avatar { width: 32px; height: 32px; border-radius: 50%; background: #F2F2F3; flex-shrink: 0; }

    .comment-body { flex: 1; min-width: 0; }

    .comment-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .comment-nickname { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.33; }
    .comment-time { font-size: 12px; color: var(--muted); }

    .comment-text { font-size: 15px; margin: 0; line-height: 1.5; color: var(--text); }

    .comment-footer { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
    .comment-footer button { background: none; border: none; padding: 0; font: inherit; font-size: 13px; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .comment-footer button:hover { color: var(--text); }

    .comment-pref {
      display: inline-block;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
      border-radius: 4px;
      padding: 0.15rem 0.5rem;
      font-size: 0.75rem;
      font-weight: 500;
      margin-top: 4px;
    }

    .add-comment-form { margin-top: 12px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; }

    .add-comment-form .comment-input-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .add-comment-form .comment-input-header img { width: 28px; height: 28px; border-radius: 50%; }
    .add-comment-form .comment-input-header span { font-size: 14px; font-weight: 600; color: var(--text); }

    .add-comment-form textarea {
      width: 100%;
      border: none;
      background: none;
      padding: 0;
      font-size: 15px;
      font-family: inherit;
      resize: none;
      min-height: 24px;
      line-height: 1.5;
      color: var(--text);
    }

    .add-comment-form textarea::placeholder { color: var(--muted); }
    .add-comment-form textarea:focus { outline: none; }

    .add-comment-form .comment-form-row { display: flex; justify-content: flex-end; margin-top: 8px; }
    .add-comment-form .comment-form-row .btn { font-size: 13px; padding: 6px 12px; }

    .comment-form-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .comment-form-row input {
      flex: 1;
      min-width: 160px;
      border: none;
      background: #F2F2F3;
      border-radius: 8px;
      padding: 0.5rem 0.7rem;
      font-size: 0.85rem;
    }

    .comment-form-row input:focus {
      outline: none;
      box-shadow: inset 0 0 0 1px var(--primary);
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }

    .empty-state .icon { font-size: 3rem; margin-bottom: 0.75rem; }
    .empty-state p { font-size: 1rem; }

    #toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: #111;
      color: white;
      padding: 0.7rem 1.2rem;
      border-radius: 8px;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 999;
    }

    #toast.show { opacity: 1; }

    @media (max-width: 743px) {
      .main { padding: 0 16px; }
      .menu-card-body { padding: 20px 0 16px; gap: 8px; }
      .post-header { padding-bottom: 0; }
      .post-nickname { font-size: 14px; }
      .post-meta-line { font-size: 12px; }
      .submit-card { padding: 16px 0; }
      .submit-card h2 { font-size: 15px; }
      .sort-bar { padding-inline: 0; }
    }

    /* Tournament styles */
    .tournament-view { display: none; }
    .tournament-view.active { display: block; }
    .feed-view.hidden { display: none; }

    .tournament-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0 0;
    }
    .tournament-header h2 { font-size: 16px; font-weight: 600; margin: 0; }

    .tournament-btn {
      background: var(--text);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }
    .tournament-btn:hover { background: #000; }
    .tournament-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .round-select { display: flex; gap: 8px; padding: 10px 0; }
    .round-select button {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }
    .round-select button:hover { border-color: var(--text); }
    .round-select button:disabled { opacity: 0.4; cursor: not-allowed; }

    .match-progress {
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      padding: 8px 0 16px;
    }
    .match-progress .round-label { color: var(--text); font-size: 16px; }

    .match-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 20px;
    }
    .match-vs {
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      padding: 4px 0;
    }
    .match-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 20px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .match-card:hover { border-color: var(--text); background: #F9F9FA; }
    .match-card:active { transform: scale(0.98); }
    .match-card .post-meta-line { margin: 0; }

    .tournament-result {
      text-align: center;
      padding: 0;
    }
    .tournament-result .trophy { font-size: 48px; margin-bottom: 12px; }
    .tournament-result h3 { font-size: 18px; font-weight: 700; margin: 0 0 0; }
    .tournament-result .menu-card { text-align: left; }
    .tournament-result .result-ranking { text-align: left; }

    .result-ranking { text-align: left; padding: 0; margin: 20px 0; }
    .result-ranking-item {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .result-ranking-item:last-child { border-bottom: none; }
    .result-rank { font-size: 15px; font-weight: 700; min-width: 28px; text-align: center; line-height: 1.33; }
    .result-ranking-info { flex: 1; min-width: 0; }
    .result-ranking-title { font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .result-ranking-meta { font-size: 13px; color: var(--muted); }

    .result-actions { display: flex; gap: 8px; justify-content: center; margin-top: 20px; }
    .result-actions button { padding: 10px 20px; }

    .leaderboard-empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
    }
    .leaderboard-empty .icon { font-size: 40px; margin-bottom: 12px; }
    .leaderboard-empty p { font-size: 15px; margin: 0; }

    .ranking-card {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 20px 0;
    }
    .ranking-card-body {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .ranking-position {
      font-size: 18px;
      font-weight: 700;
      min-width: 32px;
      text-align: center;
      padding-top: 2px;
    }
    .ranking-content { flex: 1; min-width: 0; }
    .ranking-stats {
      display: flex;
      gap: 12px;
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }
    .ranking-stats .win-rate { color: var(--up); font-weight: 600; }

    .history-section { padding: 16px 0; }
    .history-section h3 { font-size: 15px; font-weight: 600; margin: 0 0 12px; color: var(--text); }
    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .history-item:last-child { border-bottom: none; }
    .history-date { color: var(--muted); font-size: 13px; min-width: 44px; }
    .history-round { color: var(--muted); font-size: 13px; min-width: 36px; }
    .history-winner { flex: 1; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>

<header>
  <div class="header-left"><h1>ZZIKSTYPE</h1></div>
</header>


<div class="main">
  <div class="submit-card">
    <h2>+ 명대사 추천</h2>
    <div class="form-row">
      <textarea id="menu-title" rows="3" placeholder="명대사 (지문 가능)" maxlength="500"></textarea>

      <textarea id="menu-desc" rows="2" placeholder="이유"></textarea>

  <div class="sort-bar">
    <button id="sort-top" class="active">개추순</button>
    <button id="sort-new">최신순</button>
    <button id="sort-tournament">월드컵</button>
  </div>

  <div id="feed-view" class="feed-view">
    <div id="menu-list" class="menu-list">
      <div class="empty-state"><div class="icon">🥺</div><p>추천이 없습니다... 하나 하고 가세요</p></div>
    </div>
  </div>

  <div id="tournament-view" class="tournament-view">
    <div id="tournament-leaderboard">
      <div class="tournament-header">
        <h2>🏆 월드컵 랭킹</h2>
        <div style="display:flex;gap:8px;">
          <button class="tournament-btn" id="tournament-history-btn" style="background:transparent;color:var(--text);border:1px solid var(--border);">내 기록</button>

    <div id="tournament-result" style="display:none;"></div>

    <div id="tournament-history" style="display:none;">
      <div class="tournament-header">
        <h2>📋 내 월드컵 기록</h2>
        <div style="display:flex;gap:8px;">
          <button class="tournament-btn" id="history-ranking-btn" style="background:transparent;color:var(--text);border:1px solid var(--border);">랭킹 보기</button>
          <button class="tournament-btn" id="history-back-btn">참여하기</button>
        </div>
      </div>
      <div id="history-list"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  let menus = [];
  let sort = 'top';
function showToast(msg, duration = 2500) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), duration);
  }

  function getUser() {
    let id = getCookie('voter-id') || localStorage.getItem('voter-id');
    if (!id) { id = Math.random().toString(36).slice(2); }
    setCookie('voter-id', id, 365);
    localStorage.setItem('voter-id', id);
    return id;
  }
  function getCookie(name) {
    const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  }
  function setCookie(name, val, days) {
    const d = new Date(); d.setTime(d.getTime() + days*86400000);
    document.cookie = name + '=' + encodeURIComponent(val) + ';expires=' + d.toUTCString() + ';path=/;SameSite=Lax';
  }

  function relativeTime(dateStr) {
    const diff = Date.now() - new Date(dateStr).getTime();
    const m = Math.floor(diff / 60000);
    if (m < 1) return '방금 전';
    if (m < 60) return `${m}분 전`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}시간 전`;
    return `${Math.floor(h / 24)}일 전`;
  }

  async function fetchMenus() {
    try {
      const res = await fetch('/api/menus');
      menus = await res.json();
    } catch(e) {
      menus = [
        { id: 1, title: "세상은 네가 생각하는 것보다 훨씬 넓고, 너는 네가 생각하는 것보다 훨씬 대단해.", restaurant: "나미야 잡화점의 기적", author: "히가시노 게이고", submitted_by: "https://example.com", description: " 힘들 때 위로가 되는 문장", score: 7, comment_count: 2, created_by: getUser(), created_at: new Date().toISOString() },
        { id: 2, title: "우리는 모두 자신의 힘으로 발견한 것만 이해할 수 있다.", restaurant: "데미안", author: "헤르만 헤세", submitted_by: "", description: "자기 성찰에 대한 명언", score: 4, comment_count: 0, created_by: getUser(), created_at: new Date(Date.now()-3600000).toISOString() },
        { id: 3, title: "사막이 아름다운 것은 어딘가에 우물을 숨기고 있기 때문이야.", restaurant: "어린 왕자", author: "생텍쥐페리", submitted_by: "https://example.com/prince", description: "숨겨진 가치에 대해", score: 12, comment_count: 5, created_by: "someone_else", created_at: new Date(Date.now()-7200000).toISOString() },
        { id: 4, title: "인생이란 자전거를 타는 것과 같다. 균형을 잡으려면 움직여야 한다.", restaurant: "아인슈타인 어록", author: "알버트 아인슈타인", submitted_by: "", description: "행동의 중요성", score: 9, comment_count: 1, created_by: "someone_else", created_at: new Date(Date.now()-86400000).toISOString() }
      ];
    }
    renderMenus();
  }

  async function refreshScores() {
    const res = await fetch('/api/menus');
    const updated = await res.json();
    updated.forEach(u => {
      const existing = menus.find(m => m.id === u.id);
      if (existing) existing.score = u.score;
      const el = document.getElementById(`score-${u.id}`);
      if (el) el.textContent = u.score;
    });
  }

  function sortedMenus() {
    return [...menus].sort((a, b) => {
      if (sort === 'top') return b.score - a.score || new Date(b.created_at) - new Date(a.created_at);
      return new Date(b.created_at) - new Date(a.created_at);
    });
  }

  function renderMenus() {
    const list = document.getElementById('menu-list');
    const sorted = sortedMenus();
    if (!sorted.length) {
      list.innerHTML = '<div class="empty-state"><div class="icon">🥺</div><p>추천이 없습니다... 하나 하고 가세요</p></div>';
      return;
    }
    list.innerHTML = sorted.map(m => menuCard(m)).join('');
    sorted.forEach(m => attachMenuHandlers(m.id));
    // mark previously voted hearts
    const voted = JSON.parse(localStorage.getItem('voted-ids') || '[]');
    const filledPath = "m10.82 20.116-.097-.09-6.844-6.355A5.882 5.882 0 0 1 2 9.359v-.13C2 6.48 3.953 4.12 6.656 3.606A5.71 5.71 0 0 1 12 5.417a5.562 5.562 0 0 1 .977-.871 5.73 5.73 0 0 1 4.367-.945A5.73 5.73 0 0 1 22 9.23v.129c0 1.636-.68 3.199-1.879 4.312l-6.844 6.355-.097.09c-.32.297-.742.465-1.18.465a1.72 1.72 0 0 1-1.18-.465Z";
    voted.forEach(id=>{const btn=document.querySelector('.vote-btn[data-id="'+id+'"]');if(btn){btn.classList.add('active');btn.querySelector('path').setAttribute('d',filledPath);}});
  }

  function menuCard(m) {
    return `
      <div class="menu-card" id="card-${m.id}">
        <div class="menu-card-body" data-menu-id="${m.id}">
          <div class="post-header">
            <div class="post-header-left">
              <div class="post-avatar"><img src="https://d33pksfia2a94m.cloudfront.net/assets/img/avatar/avatar_blank.png" alt="" width="32" height="32"></div>
              <div class="post-header-info">
                <div class="post-author-badge">${m.author ? escHtml(m.author) : '익명'}</div>
                <span class="post-meta-line">${relativeTime(m.created_at)} · 독서합시다</span>
              </div>
            </div>
            <div class="post-more-wrapper">
              <button class="post-more-btn" aria-label="더보기" type="button" onclick="this.nextElementSibling.classList.toggle('show')"><svg focusable="false" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20.125 12a1.875 1.875 0 1 1-3.75 0 1.875 1.875 0 0 1 3.75 0Zm-6.25 0a1.875 1.875 0 1 1-3.751 0 1.875 1.875 0 0 1 3.751 0ZM5.75 13.875a1.875 1.875 0 1 1 0-3.75 1.875 1.875 0 0 1 0 3.75Z" fill="currentcolor"></path></svg></button>
              <div class="post-dropdown" ${m.created_by === getUser() ? '' : 'style="display:none"'}>
                <button onclick="editPost(${m.id})">수정</button>
                <button onclick="deletePost(${m.id})">삭제</button>
              </div>
            </div>
          </div>
          <div class="post-content">
            ${m.restaurant ? `<h2 class="post-title">${m.submitted_by ? `<a href="${escHtml(m.submitted_by)}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none;">${escHtml(m.restaurant)}</a>` : escHtml(m.restaurant)}</h2>` : ''}
            <p class="post-body" style="white-space:pre-wrap">${escHtml(m.title)}</p>
          </div>
          <div class="post-actions">
            <div class="post-actions-left">
              <button class="vote-btn up" data-id="${m.id}" data-val="1"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="m10.82 20.116-.097-.09-6.844-6.355A5.882 5.882 0 0 1 2 9.359v-.13C2 6.48 3.953 4.12 6.656 3.606A5.71 5.71 0 0 1 12 5.417a5.562 5.562 0 0 1 .977-.871 5.73 5.73 0 0 1 4.367-.945A5.73 5.73 0 0 1 22 9.23v.129c0 1.636-.68 3.199-1.879 4.312l-6.844 6.355-.097.09c-.32.297-.742.465-1.18.465a1.72 1.72 0 0 1-1.18-.465Zm.52-12.625a.205.205 0 0 1-.04-.043l-.695-.78-.003-.005A3.85 3.85 0 0 0 3.875 9.23v.13c0 1.113.465 2.18 1.281 2.937L12 18.651l6.844-6.355a4.012 4.012 0 0 0 1.281-2.937v-.13a3.851 3.851 0 0 0-6.723-2.566l-.004.004-.003.004-.696.781c-.011.016-.027.028-.039.043a.935.935 0 0 1-1.32 0v-.004Z" fill="currentcolor"/></svg><span id="score-${m.id}">${m.score}</span></button>
              <button class="toggle-comments" data-id="${m.id}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6.832 17.535a1.877 1.877 0 0 1 1.742-.25c1.035.375 2.194.59 3.428.59 4.87 0 8.123-3.145 8.123-6.25s-3.253-6.25-8.123-6.25c-4.87 0-8.122 3.145-8.122 6.25 0 1.25.484 2.453 1.394 3.484.336.38.5.88.46 1.387a6.92 6.92 0 0 1-.44 1.93 9.811 9.811 0 0 0 1.538-.887v-.004Zm-3.999 1.586c.07-.105.137-.21.2-.316.39-.649.76-1.5.835-2.457-1.172-1.332-1.863-2.961-1.863-4.723 0-4.488 4.475-8.125 9.997-8.125C17.526 3.5 22 7.137 22 11.625c0 4.488-4.475 8.125-9.998 8.125-1.448 0-2.823-.25-4.065-.7-.465.34-1.222.805-2.12 1.196a9.564 9.564 0 0 1-1.957.629c-.031.008-.062.012-.094.02-.171.03-.34.058-.515.074-.008 0-.02.004-.027.004-.2.02-.399.03-.598.03a.625.625 0 0 1-.445-1.066 5.606 5.606 0 0 0 .629-.797l.011-.019h.012Z" fill="currentcolor"/></svg>${m.comment_count}</button>
            </div>
            <div class="post-actions-right">
              <button class="post-icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4.5 4.875C4.5 3.84 5.34 3 6.375 3v16.242l5.082-3.629a.93.93 0 0 1 1.09 0l5.078 3.63V4.874H6.375V3h11.25c1.035 0 1.875.84 1.875 1.875v16.188a.938.938 0 0 1-1.48.762L12 17.526l-6.02 4.297a.938.938 0 0 1-1.48-.762z" fill="currentColor"/></svg></button>
              <button class="post-icon-btn share-btn" data-link="${escHtml(m.submitted_by || '')}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12.664 2.275a.934.934 0 0 0-1.324 0l-5.004 5A.937.937 0 0 0 7.66 8.6l3.399-3.398v9.614c0 .519.418.937.937.937.52 0 .938-.418.938-.938V5.202L16.332 8.6a.937.937 0 0 0 1.324-1.324l-4.992-5ZM5.125 15.44a.935.935 0 0 0-.938-.938.935.935 0 0 0-.937.938v3.124a3.438 3.438 0 0 0 3.438 3.438h10.625a3.438 3.438 0 0 0 3.437-3.438V15.44a.935.935 0 0 0-.938-.938.935.935 0 0 0-.937.938v3.124c0 .864-.7 1.563-1.563 1.563H6.688c-.863 0-1.562-.7-1.562-1.563V15.44Z" fill="currentColor"/></svg></button>
            </div>
          </div>
          ${m.description ? `<div class="post-comment-bubble" onclick="toggleComments(${m.id})"><div class="post-comment-avatar"><img src="https://d33pksfia2a94m.cloudfront.net/assets/img/avatar/avatar_blank.png" width="24" height="24" alt=""></div><p class="post-comment-text">${escHtml(m.description)}</p></div>` : ''}
        </div>
        <div class="comments-section" id="comments-${m.id}">
          <div id="comment-list-${m.id}">Loading…</div>
          <div class="add-comment-form">
            <div class="comment-input-header"><img src="https://d33pksfia2a94m.cloudfront.net/assets/img/avatar/avatar_blank.png" alt=""><span>익명</span></div>
            <textarea id="comment-text-${m.id}" placeholder="공감할래말래" rows="1"></textarea>
            <div class="comment-form-row">
<button class="btn" onclick="submitComment(${m.id}, this)">등록</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function attachMenuHandlers(id) {
    const card = document.querySelector(`#feed-view #card-${id}`);
    if (!card) return;
    const voteBtn = card.querySelector(`.vote-btn[data-id="${id}"]`);
    if (voteBtn) voteBtn.addEventListener('click', () => vote(id, 1));
    const commentBtn = card.querySelector(`.toggle-comments[data-id="${id}"]`);
    if (commentBtn) commentBtn.addEventListener('click', (e) => toggleComments(id, e.currentTarget));
    const shareBtn = card.querySelector('.share-btn');
    if (shareBtn) {
      shareBtn.addEventListener('click', () => {
        const link = shareBtn.getAttribute('data-link');
        if (link) { navigator.clipboard.writeText(link); showToast('링크가 복사되었습니다!'); }
        else { showToast('링크가 없습니다'); }
      });
    }
  }

  async function vote(menuId, value) {
    const res = await fetch(`/api/menus/${menuId}/vote`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ voter: getUser(), value })
    });
    if (!res.ok) { showToast('Vote failed.'); return; }
    const { score } = await res.json();
    // Update ALL instances of this card across all tabs
    document.querySelectorAll(`[id$="score-${menuId}"]`).forEach(el => el.textContent = score);
    const isNowVoted = !JSON.parse(localStorage.getItem('voted-ids') || '[]').includes(menuId);
    const filled = "m10.82 20.116-.097-.09-6.844-6.355A5.882 5.882 0 0 1 2 9.359v-.13C2 6.48 3.953 4.12 6.656 3.606A5.71 5.71 0 0 1 12 5.417a5.562 5.562 0 0 1 .977-.871 5.73 5.73 0 0 1 4.367-.945A5.73 5.73 0 0 1 22 9.23v.129c0 1.636-.68 3.199-1.879 4.312l-6.844 6.355-.097.09c-.32.297-.742.465-1.18.465a1.72 1.72 0 0 1-1.18-.465Z";
    const outlined = "m10.82 20.116-.097-.09-6.844-6.355A5.882 5.882 0 0 1 2 9.359v-.13C2 6.48 3.953 4.12 6.656 3.606A5.71 5.71 0 0 1 12 5.417a5.562 5.562 0 0 1 .977-.871 5.73 5.73 0 0 1 4.367-.945A5.73 5.73 0 0 1 22 9.23v.129c0 1.636-.68 3.199-1.879 4.312l-6.844 6.355-.097.09c-.32.297-.742.465-1.18.465a1.72 1.72 0 0 1-1.18-.465Zm.52-12.625a.205.205 0 0 1-.04-.043l-.695-.78-.003-.005A3.85 3.85 0 0 0 3.875 9.23v.13c0 1.113.465 2.18 1.281 2.937L12 18.651l6.844-6.355a4.012 4.012 0 0 0 1.281-2.937v-.13a3.851 3.851 0 0 0-6.723-2.566l-.004.004-.003.004-.696.781c-.011.016-.027.028-.039.043a.935.935 0 0 1-1.32 0v-.004Z";
    document.querySelectorAll(`.vote-btn[data-id="${menuId}"]`).forEach(btn => {
      if (isNowVoted) btn.classList.add('active'); else btn.classList.remove('active');
      btn.querySelector('path').setAttribute('d', isNowVoted ? filled : outlined);
    });
    // persist vote state locally
    let voted = JSON.parse(localStorage.getItem('voted-ids') || '[]');
    if (isNowVoted) { if (!voted.includes(menuId)) voted.push(menuId); }
    else { voted = voted.filter(x => x !== menuId); }
    localStorage.setItem('voted-ids', JSON.stringify(voted));
    const menu = menus.find(m => m.id === menuId);
    if (menu) menu.score = score;
  }

  async function toggleComments(menuId, triggerEl) {
    // Find the closest card container, then find the comments section within it
    const card = triggerEl ? triggerEl.closest('.menu-card, .match-card') : document.getElementById(`card-${menuId}`);
    if (!card) return;
    const section = card.querySelector('.comments-section');
    if (!section) return;
    const open = section.classList.toggle('open');
    if (open) await loadCommentsInEl(menuId, card);
  }

  async function loadCommentsInEl(menuId, card) {
    const listEl = card.querySelector('[id$="comment-list-' + menuId + '"], .comment-list');
    // Fallback: find any child that looks like a comment list container
    const target = listEl || card.querySelector('.comments-section > div:first-child');
    if (!target) return;
    let comments;
    try {
      const res = await fetch(`/api/menus/${menuId}/comments`);
      comments = await res.json();
    } catch(e) { comments = []; }
    if (!comments.length) { target.innerHTML = ''; return; }
    target.innerHTML = comments.map(c => `
      <div class="comment-item">
        <img class="comment-avatar" src="https://d33pksfia2a94m.cloudfront.net/assets/img/avatar/avatar_blank.png" alt="">
        <div class="comment-body">
          <div class="comment-header">
            <span class="comment-nickname">익명</span>
            <span class="comment-time">${relativeTime(c.created_at)}</span>
          </div>
          <div class="comment-text">${escHtml(c.content)}</div>
          ${c.preferences ? `<span class="comment-pref">🥗 ${escHtml(c.preferences)}</span>` : ''}
        </div>
      </div>
    `).join('');
  }

  async function loadComments(menuId) {
    // Legacy: load comments into ALL visible instances of this card
    document.querySelectorAll(`[data-menu-id="${menuId}"]`).forEach(cardBody => {
      const card = cardBody.closest('.menu-card');
      if (card) loadCommentsInEl(menuId, card);
    });
  }

  async function submitComment(menuId, triggerEl) {
    const card = triggerEl ? triggerEl.closest('.menu-card, .match-card') : document.getElementById(`card-${menuId}`);
    if (!card) return;
    const contentEl = card.querySelector('textarea[id$="comment-text-' + menuId + '"], textarea');
    if (!contentEl) return;
    const content = contentEl.value.trim();
    if (!content) { showToast('댓글을 입력해주세요'); return; }

    const res = await fetch(`/api/menus/${menuId}/comments`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ author: getUser(), content })
    });

    if (!res.ok) { showToast('댓글 등록 실패'); return; }

    contentEl.value = '';
    showToast('댓글이 등록되었습니다!');
    // Reload comments in ALL visible instances of this card
    document.querySelectorAll(`[data-menu-id="${menuId}"]`).forEach(cardBody => {
      const c = cardBody.closest('.menu-card, .match-card');
      if (c && c.querySelector('.comments-section.open')) loadCommentsInEl(menuId, c);
    });

    const menu = menus.find(m => m.id === menuId);
    if (menu) menu.comment_count = (menu.comment_count || 0) + 1;
  }

  document.getElementById('submit-menu-btn').addEventListener('click', async () => {
    const title = document.getElementById('menu-title').value.trim();
    const restaurant = document.getElementById('menu-restaurant').value.trim();
    const author = document.getElementById('menu-author').value.trim();
    const submitter = document.getElementById('menu-submitter').value.trim();
    const desc = document.getElementById('menu-desc').value.trim();
    if (!title) { showToast('명대사를 적어주세요.'); return; }

    const res = await fetch('/api/menus', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, restaurant, description: desc, submitted_by: submitter || '', author: author || '', created_by: getUser() })
    });

    if (!res.ok) { showToast('추천 실패'); return; }
    const menu = await res.json();
    menus.unshift(menu);
    document.getElementById('menu-title').value = '';
    document.getElementById('menu-restaurant').value = '';
    document.getElementById('menu-author').value = '';
    document.getElementById('menu-submitter').value = '';
    document.getElementById('menu-desc').value = '';
    showToast('추천 완! >.<');
    renderMenus();
  });

  function renderRoundSelect() {

    const available = menus.length;
    if (available < 8) {

      return;

    const fixedSizes = [8, 16, 32].filter(s => s <= available);
    let buttons = fixedSizes.map(s => `<button onclick="startTournament(${s})">${s}강</button>`).join('');
    buttons += `<button onclick="startTournament(${available})">${available}강</button>`;
    select.innerHTML = buttons;
  }

  function startTournament(size) {
    const shuffled = [...menus].sort(() => Math.random() - 0.5).slice(0, size);
    // Calculate byes: next power of 2 minus actual count
    const nextPow2 = Math.pow(2, Math.ceil(Math.log2(shuffled.length)));
    const byeCount = nextPow2 - shuffled.length;
    // First `byeCount` entries get a bye (auto-advance to round 2)
    const byes = shuffled.slice(0, byeCount);
    const firstRound = shuffled.slice(byeCount);

    tournamentState = {
      roundSize: size,
      bracket: shuffled,
      currentRound: firstRound,
      matchIndex: 0,
      winners: [...byes], // byes auto-advance
      eliminated: [],
      history: [],
      matches: [],
    };
    document.getElementById('round-select').innerHTML = '';
    renderMatch();
  }

            </div>
          </div>
          ${m.description ? `<div class="post-comment-bubble" onclick="event.stopPropagation();toggleComments(${m.id}, this)"><div class="post-comment-avatar"><img src="https://d33pksfia2a94m.cloudfront.net/assets/img/avatar/avatar_blank.png" width="24" height="24" alt=""></div><p class="post-comment-text">${escHtml(m.description)}</p></div>` : ''}
          <div class="comments-section" id="match-comments-${side}">
            <div id="match-comment-list-${side}"></div>
            <div class="add-comment-form">
              <div class="comment-input-header"><img src="https://d33pksfia2a94m.cloudfront.net/assets/img/avatar/avatar_blank.png" alt=""><span>익명</span></div>
              <textarea id="match-comment-text-${side}" placeholder="댓글을 남겨보세요" rows="1" onclick="event.stopPropagation()"></textarea>
              <div class="comment-form-row"><button class="btn" onclick="event.stopPropagation();submitComment(${m.id}, this)">등록</button></div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function renderMatch() {
    const { currentRound, matchIndex, winners } = tournamentState;
    const totalMatches = currentRound.length / 2;

    if (matchIndex >= totalMatches) {
      if (winners.length === 1) {
        finishTournament(winners[0]);
        return;
      }
      tournamentState.currentRound = winners;
      tournamentState.winners = [];
      tournamentState.matchIndex = 0;
      renderMatch();
      return;
    }

    const a = currentRound[matchIndex * 2];
    const b = currentRound[matchIndex * 2 + 1];
    const roundLabel = getRoundLabel(currentRound.length);
    const matchNum = matchIndex + 1;

    document.getElementById('game-title').textContent = `${roundLabel} ${matchNum}/${totalMatches}`;

    document.getElementById('match-area').innerHTML = `
      <div class="match-container">
        ${matchCardHtml(a, 'a')}
        <div class="match-vs">VS</div>
        ${matchCardHtml(b, 'b')}
      </div>
    `;

    document.getElementById('match-a').addEventListener('click', () => pickWinner(a, b));
    document.getElementById('match-b').addEventListener('click', () => pickWinner(b, a));
  }

  async function loadMatchComments(menuId, targetElId) {
    const el = document.getElementById(targetElId);
    try {
      const res = await fetch(`/api/menus/${menuId}/comments`);
      const comments = await res.json();
      if (!comments.length) {
        el.innerHTML = '<p style="font-size:13px;color:var(--muted);padding:8px 0;">아직 댓글이 없습니다</p>';
        return;
      }
      el.innerHTML = comments.map(c => `
        <div class="comment-item">
          <img class="comment-avatar" src="https://d33pksfia2a94m.cloudfront.net/assets/img/avatar/avatar_blank.png" alt="">
          <div class="comment-body">
            <div class="comment-header">
              <span class="comment-nickname">익명</span>
              <span class="comment-time">${relativeTime(c.created_at)}</span>
            </div>
            <div class="comment-text">${escHtml(c.content)}</div>
            ${c.preferences ? `<span class="comment-pref">🥗 ${escHtml(c.preferences)}</span>` : ''}
          </div>
        </div>
      `).join('');
    } catch(e) {
      el.innerHTML = '<p style="font-size:13px;color:var(--muted);padding:8px 0;">댓글을 불러올 수 없습니다</p>';
    }
  }

  async function pickWinner(winner, loser) {
    // Save current state for undo
    tournamentState.history = tournamentState.history || [];
    tournamentState.history.push({
      currentRound: [...tournamentState.currentRound],
      matchIndex: tournamentState.matchIndex,
      winners: [...tournamentState.winners],
      eliminated: [...tournamentState.eliminated],
      matches: [...(tournamentState.matches || [])],
    });

    tournamentState.winners.push(winner);
    tournamentState.eliminated.push(loser);
    tournamentState.matchIndex++;

    // Store match locally — will be submitted when tournament finishes
    tournamentState.matches = tournamentState.matches || [];
    tournamentState.matches.push({ winner_id: winner.id, loser_id: loser.id });

    renderMatch();
  }

  function finishTournament(winner) {
    // Build final ranking: winner first, then eliminated in reverse order
    const ranking = [winner, ...tournamentState.eliminated.reverse()];

    // Batch submit all matches to server
    const player = getUser();
    const roundSize = tournamentState.roundSize;
    (tournamentState.matches || []).forEach(match => {
      fetch('/api/tournament/matches', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...match, player, round_size: roundSize })
      }).catch(() => {});
    });

    // Save to localStorage
    const history = JSON.parse(localStorage.getItem('tournament-history') || '[]');
    history.unshift({
      date: new Date().toISOString(),
      roundSize: tournamentState.roundSize,
      ranking: ranking.map(m => ({ id: m.id, title: m.title, restaurant: m.restaurant, author: m.author })),
    });
    // Keep last 20
    if (history.length > 20) history.length = 20;
    localStorage.setItem('tournament-history', JSON.stringify(history));

    // Show result
    showTournamentSection('tournament-result');
    document.getElementById('tournament-result').innerHTML = `
      <div class="tournament-result">
        <div class="menu-card" id="result-winner-card">
          <div class="menu-card-body" data-menu-id="${winner.id}">
            <div class="post-header">
              <div class="post-header-left">
                <div class="post-avatar"><img src="https://d33pksfia2a94m.cloudfront.net/assets/img/avatar/avatar_blank.png" alt="" width="32" height="32"></div>
                <div class="post-header-info">
                  <div class="post-author-badge">${winner.author ? escHtml(winner.author) : '익명'}</div>
                  <span class="post-meta-line">🥇 · 독서합시다</span>
                </div>
              </div>
            </div>
            <div class="post-content">
              ${winner.restaurant ? `<h2 class="post-title">${escHtml(winner.restaurant)}</h2>` : ''}
              <p class="post-body" style="white-space:pre-wrap">${escHtml(winner.title)}</p>
            </div>
            <div class="post-actions">
              <div class="post-actions-left">
                <button class="vote-btn up" data-id="${winner.id}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="m10.82 20.116-.097-.09-6.844-6.355A5.882 5.882 0 0 1 2 9.359v-.13C2 6.48 3.953 4.12 6.656 3.606A5.71 5.71 0 0 1 12 5.417a5.562 5.562 0 0 1 .977-.871 5.73 5.73 0 0 1 4.367-.945A5.73 5.73 0 0 1 22 9.23v.129c0 1.636-.68 3.199-1.879 4.312l-6.844 6.355-.097.09c-.32.297-.742.465-1.18.465a1.72 1.72 0 0 1-1.18-.465Zm.52-12.625a.205.205 0 0 1-.04-.043l-.695-.78-.003-.005A3.85 3.85 0 0 0 3.875 9.23v.13c0 1.113.465 2.18 1.281 2.937L12 18.651l6.844-6.355a4.012 4.012 0 0 0 1.281-2.937v-.13a3.851 3.851 0 0 0-6.723-2.566l-.004.004-.003.004-.696.781c-.011.016-.027.028-.039.043a.935.935 0 0 1-1.32 0v-.004Z" fill="currentcolor"/></svg><span id="rscore-${winner.id}">${winner.score || 0}</span></button>
                <button class="toggle-comments" data-id="${winner.id}" onclick="toggleComments(${winner.id}, this)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6.832 17.535a1.877 1.877 0 0 1 1.742-.25c1.035.375 2.194.59 3.428.59 4.87 0 8.123-3.145 8.123-6.25s-3.253-6.25-8.123-6.25c-4.87 0-8.122 3.145-8.122 6.25 0 1.25.484 2.453 1.394 3.484.336.38.5.88.46 1.387a6.92 6.92 0 0 1-.44 1.93 9.811 9.811 0 0 0 1.538-.887v-.004Zm-3.999 1.586c.07-.105.137-.21.2-.316.39-.649.76-1.5.835-2.457-1.172-1.332-1.863-2.961-1.863-4.723 0-4.488 4.475-8.125 9.997-8.125C17.526 3.5 22 7.137 22 11.625c0 4.488-4.475 8.125-9.998 8.125-1.448 0-2.823-.25-4.065-.7-.465.34-1.222.805-2.12 1.196a9.564 9.564 0 0 1-1.957.629c-.031.008-.062.012-.094.02-.171.03-.34.058-.515.074-.008 0-.02.004-.027.004-.2.02-.399.03-.598.03a.625.625 0 0 1-.445-1.066 5.606 5.606 0 0 0 .629-.797l.011-.019h.012Z" fill="currentcolor"/></svg>${winner.comment_count || 0}</button>
              </div>
              <div class="post-actions-right">
                <button class="post-icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4.5 4.875C4.5 3.84 5.34 3 6.375 3v16.242l5.082-3.629a.93.93 0 0 1 1.09 0l5.078 3.63V4.874H6.375V3h11.25c1.035 0 1.875.84 1.875 1.875v16.188a.938.938 0 0 1-1.48.762L12 17.526l-6.02 4.297a.938.938 0 0 1-1.48-.762z" fill="currentColor"/></svg></button>
                <button class="post-icon-btn share-btn" data-link="${escHtml(winner.submitted_by || '')}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12.664 2.275a.934.934 0 0 0-1.324 0l-5.004 5A.937.937 0 0 0 7.66 8.6l3.399-3.398v9.614c0 .519.418.937.937.937.52 0 .938-.418.938-.938V5.202L16.332 8.6a.937.937 0 0 0 1.324-1.324l-4.992-5ZM5.125 15.44a.935.935 0 0 0-.938-.938.935.935 0 0 0-.937.938v3.124a3.438 3.438 0 0 0 3.438 3.438h10.625a3.438 3.438 0 0 0 3.437-3.438V15.44a.935.935 0 0 0-.938-.938.935.935 0 0 0-.937.938v3.124c0 .864-.7 1.563-1.563 1.563H6.688c-.863 0-1.562-.7-1.562-1.563V15.44Z" fill="currentColor"/></svg></button>
              </div>
            </div>
            ${winner.description ? `<div class="post-comment-bubble" onclick="toggleComments(${winner.id}, this)"><div class="post-comment-avatar"><img src="https://d33pksfia2a94m.cloudfront.net/assets/img/avatar/avatar_blank.png" width="24" height="24" alt=""></div><p class="post-comment-text">${escHtml(winner.description)}</p></div>` : ''}
            <div class="comments-section" id="rw-comments-${winner.id}">
              <div id="rw-comment-list-${winner.id}"></div>
              <div class="add-comment-form">
                <div class="comment-input-header"><img src="https://d33pksfia2a94m.cloudfront.net/assets/img/avatar/avatar_blank.png" alt=""><span>익명</span></div>
                <textarea id="rw-comment-text-${winner.id}" placeholder="공감할래말래" rows="1"></textarea>
                <div class="comment-form-row"><button class="btn" onclick="submitComment(${winner.id}, this)">등록</button></div>
              </div>
            </div>
          </div>
        </div>

        <div class="result-ranking">
          ${ranking.slice(1).map((m, i) => {
            const idx = i + 1;
            const medal = idx === 1 ? '🥈' : idx === 2 ? '🥉' : (idx+1);
            return `
              <div class="result-ranking-item">
                <div class="result-rank">${medal}</div>
                <div class="result-ranking-info">
                  <div class="result-ranking-title">${m.restaurant ? escHtml(m.restaurant) : ''}${m.author ? ` <span style="font-weight:400;color:var(--muted);font-size:12px;">· ${escHtml(m.author)}</span>` : ''}</div>
                  <div class="post-body" style="font-size:14px;margin-top:2px;white-space:pre-wrap;">${escHtml(m.title)}</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <div class="result-actions">
          <button class="tournament-btn" style="background:transparent;color:var(--text);border:1px solid var(--border);" onclick="showTournamentSection('tournament-leaderboard');loadTournamentLeaderboard();">랭킹 보기</button>
          <button class="tournament-btn" onclick="showTournamentSection('tournament-game');document.getElementById('game-title').textContent='라운드 선택';document.getElementById('match-area').innerHTML='';renderRoundSelect();">다시하기</button>
        </div>
      </div>
    `;

    // Attach handlers for result page cards
    const resultEl = document.getElementById('tournament-result');
    const winnerVoteBtn = resultEl.querySelector(`#result-winner-card .vote-btn[data-id="${winner.id}"]`);
    if (winnerVoteBtn) winnerVoteBtn.addEventListener('click', () => vote(winner.id, 1));
    const winnerShareBtn = resultEl.querySelector('#result-winner-card .share-btn');
    if (winnerShareBtn) winnerShareBtn.addEventListener('click', () => {
      const link = winnerShareBtn.getAttribute('data-link');
      if (link) { navigator.clipboard.writeText(link); showToast('링크가 복사되었습니다!'); }
      else { showToast('링크가 없습니다'); }
    });
    resultEl.querySelectorAll('.share-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const link = btn.getAttribute('data-link');
        if (link) { navigator.clipboard.writeText(link); showToast('링크가 복사되었습니다!'); }
        else { showToast('링크가 없습니다'); }
      });
    });
    // Mark voted hearts
    const voted = JSON.parse(localStorage.getItem('voted-ids') || '[]');
    const filledPath = "m10.82 20.116-.097-.09-6.844-6.355A5.882 5.882 0 0 1 2 9.359v-.13C2 6.48 3.953 4.12 6.656 3.606A5.71 5.71 0 0 1 12 5.417a5.562 5.562 0 0 1 .977-.871 5.73 5.73 0 0 1 4.367-.945A5.73 5.73 0 0 1 22 9.23v.129c0 1.636-.68 3.199-1.879 4.312l-6.844 6.355-.097.09c-.32.297-.742.465-1.18.465a1.72 1.72 0 0 1-1.18-.465Z";
    voted.forEach(id => {
      resultEl.querySelectorAll(`.vote-btn[data-id="${id}"]`).forEach(btn => {
        btn.classList.add('active');
        btn.querySelector('path').setAttribute('d', filledPath);
      });
    });

  function renderHistory() {
    const history = JSON.parse(localStorage.getItem('tournament-history') || '[]');
    const list = document.getElementById('history-list');

    if (!history.length) {
      list.innerHTML = '<div class="leaderboard-empty"><div class="icon">📋</div><p>아직 기록이 없습니다<br>월드컵에 참여해보세요!</p></div>';
      return;
    }

    // Find most frequent winner(s) including ties — use ID to distinguish same-title cards
    const winCounts = {};
    const winMenus = {};
    history.forEach(h => {
      const w = h.ranking[0];
      const key = w.id;
      winCounts[key] = (winCounts[key] || 0) + 1;
      if (!winMenus[key]) winMenus[key] = w;
    });
    const sorted = Object.entries(winCounts).sort((a, b) => b[1] - a[1]);
    const topCount = sorted.length ? sorted[0][1] : 0;
    const topEntries = sorted.filter(([_, count]) => count === topCount);

    list.innerHTML = `
      ${topEntries.length ? `
        <div style="padding:12px 0 0;font-size:14px;color:var(--muted);cursor:pointer;" onclick="document.getElementById('top-winner-detail').style.display = document.getElementById('top-winner-detail').style.display === 'none' ? 'block' : 'none'">
          내 최다 우승: ${topEntries.map(([id]) => `<strong style="color:var(--text);">${escHtml(winMenus[id].restaurant || winMenus[id].title.slice(0, 20))}</strong>`).join(', ')} (${topCount}회) <span style="font-size:12px;">▼</span>
        </div>
        <div id="top-winner-detail" style="display:none;">
          ${topEntries.map(([id]) => {
            const m = winMenus[id];
            return `<div class="result-ranking-item">
              <div class="result-rank">🏆</div>
              <div class="result-ranking-info">
                <div class="result-ranking-title">${m.restaurant ? escHtml(m.restaurant) : ''}${m.author ? ` <span style="font-weight:400;color:var(--muted);font-size:12px;">· ${escHtml(m.author)}</span>` : ''}</div>
                <div class="post-body" style="font-size:14px;margin-top:2px;white-space:pre-wrap;">${escHtml(m.title)}</div>
              </div>
            </div>`;
          }).join('')}
        </div>
      ` : ''}
      <div class="history-section">
        ${history.map((h, idx) => {
          const w = h.ranking[0];
          const d = new Date(h.date);
          const dateStr = `${d.getMonth()+1}/${d.getDate()}`;
          return `
            <div class="history-item" onclick="toggleHistoryDetail(${idx})" style="cursor:pointer;">
              <span class="history-date">${dateStr}</span>
              <span class="history-round">${h.roundSize}강</span>
              <span class="history-winner">🏆 ${w.restaurant ? escHtml(w.restaurant) : escHtml(w.title.slice(0, 25))}</span>
              <span style="color:var(--muted);font-size:12px;">▼</span>
            </div>
            <div class="history-detail" id="history-detail-${idx}" style="display:none;padding:8px 0 16px;border-bottom:1px solid var(--border);">
              ${h.ranking.map((m, i) => {
                const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i+1);
                return `<div class="result-ranking-item">
                  <div class="result-rank">${medal}</div>
                  <div class="result-ranking-info">
                    <div class="result-ranking-title">${m.restaurant ? escHtml(m.restaurant) : ''}${m.author ? ` <span style="font-weight:400;color:var(--muted);font-size:13px;">· ${escHtml(m.author)}</span>` : ''}</div>
                    <div class="post-body" style="font-size:14px;margin-top:2px;white-space:pre-wrap;">${escHtml(m.title)}</div>
                  </div>
                </div>`;
              }).join('')}
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  function toggleHistoryDetail(idx) {
    const el = document.getElementById(`history-detail-${idx}`);
    if (!el) return;
    el.style.display = el.style.display === 'none' ? 'block' : 'none';
  }
</script>
